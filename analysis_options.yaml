include: package:flutter_lints/flutter.yaml

linter:
    rules:
        - always_declare_return_types
        - annotate_overrides
        - avoid_empty_else
        - avoid_print
        - avoid_relative_lib_imports
        - avoid_slow_async_io
        - avoid_type_to_string
        - avoid_types_as_parameter_names
        - avoid_unnecessary_containers
        - avoid_web_libraries_in_flutter
        - cancel_subscriptions
        - close_sinks
        - collection_methods_unrelated_type
        - combinators_ordering
        - comment_references
        - dangling_library_doc_comments
        - depend_on_referenced_packages
        - directives_ordering
        - empty_catches
        - empty_statements
        - implicit_reopen
        - invalid_case_patterns
        - library_annotations
        - no_adjacent_strings_in_list
        - no_duplicate_case_values
        - no_self_assignments
        - no_wildcard_variable_uses
        - prefer_const_constructors
        - prefer_const_declarations
        - prefer_final_fields
        - prefer_final_locals
        - prefer_void_to_null
        - sort_pub_dependencies
        - test_types_in_equals
        - throw_in_finally
        - unnecessary_statements
        - unrelated_type_equality_checks
        - use_super_parameters

analyzer:
    errors:
        missing_return: error
        dead_code: warning
    exclude:
        - '**/*.g.dart'
        # The charts companion is its own package with its own dependencies
        # (fl_chart / graphic). It is analysed by its own CI job, which runs
        # `pub get` there first — including it here would resolve its
        # imports against this package's config and fail.
        - 'packages/**'
