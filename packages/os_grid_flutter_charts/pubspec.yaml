name: os_grid_flutter_charts
description: >-
  Integrated Charts companion for os_grid_flutter: render OsChartDefinition
  snapshots with fl_chart or graphic.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  graphic: ^2.7.0
  os_grid_flutter:
    path: ../..

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
